#----------------------------------#
# COWRIE MAIN CONFIGURATION        #
#----------------------------------#

[honeypot]
# Fake server hostname — visible in the SSH prompt.
# Confirms that the configuration file is correctly loaded by Cowrie.
hostname = HAFSA-HP


#----------------------------------#
# SSH CONFIGURATION                #
#----------------------------------#

[ssh]
# Cowrie listens on port 2222 (not 22, which is reserved for the real SSH daemon).
# interface=0.0.0.0 means Cowrie accepts connections on all network interfaces.
listen_endpoints = tcp:2222:interface=0.0.0.0


#----------------------------------#
# AUTHENTICATION                   #
#----------------------------------#

[auth]

# auth_none_enabled = false : disables the "accept any password" mode.
# Setting this to true would accept all credentials — useful for testing
# but too permissive for a realistic honeypot scenario.
auth_none_enabled = false

# Force Cowrie to use the UserDB authentication class,
# which reads valid credentials from the userdb.txt file.
auth_class = UserDB

# Path to the user database file.
# Must match the Docker volume mount defined in docker-compose.yml.
userdb = /cowrie/cowrie-git/etc/userdb.txt

# Allow root login — attackers commonly target the root account.
allow_root = true

# Honeypot behavior: accept the connection after N failed attempts.
# Simulates a server that eventually lets the attacker in,
# encouraging post-exploitation activity for richer log data.
accept_after = 5


#----------------------------------#
# LOGGING                          #
#----------------------------------#

[output_jsonlog]

# Enable JSON logging — required by collector.py.
# The collector tails this file to process SSH events in real time.
enabled = true

# Output path for the JSON log file.
# Must match the volume mount and the COWRIE_LOG path in collector.py.
logfile = /cowrie/var/log/cowrie/cowrie.json